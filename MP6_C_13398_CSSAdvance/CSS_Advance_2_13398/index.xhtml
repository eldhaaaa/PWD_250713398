<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Formulir Pendaftaran Lomba</h1>

    <form action="" method="post" enctype="multipart/form-data">

        <h2>Data Tim</h2>
        <table cellspacing="4" cellpadding="4" border="1"
                style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="namaTim"><strong>Nama Tim</strong></label>
                </td>
                <td>
                    <input type="text" id="namaTim" name="namaTim" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="namaKetua"><strong>Nama Ketua</strong></label>
                </td>
                <td>
                    <input type="text" id="namaKetua" name="namaKetua" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="jumlahAnggota"><strong>Jumlah Anggota</strong></label>
                </td>
                <td>
                    <input type="text" id="jumlahAnggota" name="jumlahAnggota" size="10" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <h2>Data Anggota Tim</h2>
        <table cellspacing="4" cellpadding="4" border="1"
                style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="anggota1"><strong>Nama anggota 1</strong></label>
                </td>
                <td>
                    <input type="text" id="anggota1" name="anggota1" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi1"><strong>Program Studi Anggota 1</strong></label>
                </td>
                <td>
                    <select id="prodi1" name="prodi1">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="anggota2"><strong>Nama anggota 2</strong></label>
                </td>
                <td>
                    <input type="text" id="anggota2" name="anggota2" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi2"><strong>Program Studi Anggota 2</strong></label>
                </td>
                <td>
                    <select id="prodi2" name="prodi2">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <h2>Pilihan Lomba</h2>
        <table cellspacing="4" cellpadding="4" border="1"
                style="border-collapse:collapse; width:100%;">
            
            <tr>
                <td style="width:32%; vertical-align:top;">
                    <strong>Bidang Lomba</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="programming" name="bidang"
                            value="Programming" />
                        <label for="programming">Programming</label>
                    </p>
                    <p>
                        <input type="checkbox" id="uiux" name="bidang"
                            value="UI/UX Design" />
                        <label for="uiux">UI/UX Design</label>
                    </p>
                    <p>
                        <input type="checkbox" id="karyaTulis" name="bidang"
                            value="Karya Tulis" />
                        <label for="karyaTulis">Karya Tulis</label>
                    </p>
                </td>
            </tr>
        </table>

        <h2>Informasi Karya</h2>
        <table cellspacing="4" cellpadding="4" border="1"
                style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%; vertical-align:top;">
                    <label for="deskripsi"><strong>Deskripsi Karya</strong></label>
                </td>
                <td>
                    <textarea name="deskripsi" id="deskripsi"
                        rows="8" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="fileKarya"><strong>File Karya</strong></label>
                </td>
                <td>
                    <input type="file" id="fileKarya" name="fileKarya" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="daftar" value="Daftar" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
